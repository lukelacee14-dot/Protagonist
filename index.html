<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Protagonist</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="protagonist-icon.png" />
  <link rel="apple-touch-icon" href="protagonist-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-2: #1c1c1c;
      --border: #2a2a2a;
      --text: #e8e4dc;
      --text-muted: #7a7670;
      --gold: #c9a84c;
      --gold-dim: #9c7f38;
      --gold-bright: #e8c96a;
      --danger: #c0392b;
      --success: #4caf50;
      --radius: 12px;
      --radius-sm: 8px;
      --font-display: 'Fredoka One', cursive;
      --font-body: 'DM Sans', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Screens ── */
    .screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .screen.active {
      display: flex;
    }

    /* ── Splash Screen ── */
    #screen-splash {
      background: var(--bg);
    }

    .splash-bg {
      position: absolute;
      inset: 0;
      background-image: url('protagonist-splash.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }

    .splash-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 40%,
        rgba(10, 10, 10, 0.6) 65%,
        rgba(10, 10, 10, 0.95) 100%
      );
    }

    .splash-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      width: 100%;
      padding-bottom: 60px;
    }

    .btn-begin {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--gold);
      background: transparent;
      border: 2px solid var(--gold);
      border-radius: var(--radius);
      padding: 14px 48px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 16px rgba(201, 168, 76, 0.2);
      -webkit-tap-highlight-color: transparent;
    }

    .btn-begin:active {
      background: rgba(201, 168, 76, 0.15);
      box-shadow: 0 0 28px rgba(201, 168, 76, 0.45);
    }

    /* ── Home Screen (placeholder) ── */
    #screen-home {
      background: var(--bg);
      padding: 32px 24px;
    }

    .home-title {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .home-sub {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="screen-splash" class="screen active">
    <div class="splash-bg"></div>
    <div class="splash-overlay"></div>
    <div class="splash-content">
      <button class="btn-begin" id="btn-begin">Begin Your Journey</button>
    </div>
  </div>

  <!-- Home Screen -->
  <div id="screen-home" class="screen">
    <p class="home-title">Welcome, Protagonist.</p>
    <p class="home-sub">Your adventure begins here.</p>
  </div>

  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    // Screen navigation
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    document.getElementById('btn-begin').addEventListener('click', () => {
      showScreen('screen-home');
    });
  </script>
</body>
</html>
